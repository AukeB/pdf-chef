[project]
name = "pdf-chef"
version = "0.1.0"
description = "Code for converting .json files into good looking pdf documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "reportlab>=5.0.0",
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = [
    "docstring-tailor>=0.4.1",
    "ty>=0.0.62",
    "ruff>=0.15.22",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyright>=1.1.414",
    "deptry>=0.25.1",
]

# UV settings
[tool.uv]
default-groups = ["dev"]

# Docstring-tailor settings

[tool.docstring_tailor]
line-length = 80
style = "google"

# Deptry settings

[tool.deptry]
known_first_party = ["pdf_chef"]

# Build settings

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_chef"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # tests are not held to annotation rules
